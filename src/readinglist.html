<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;">
<title>稍后读 - OpenCosy</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root{--bg:#f3f3f3;--card:#fff;--text:#222;--sub:#666;--border:#dfe4e1;--accent:#0078d4;--danger:#dc3545;--hover:#eef3f8;}
[data-theme="dark"]{--bg:#1a1a1a;--card:#2d2d2d;--text:#e6e6e6;--sub:#9a9a9a;--border:#444;--hover:#3a3a3a;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);padding:24px;transition:.3s;max-width:960px;margin:0 auto;}
h1{font-size:20px;margin-bottom:4px;}
.tip{color:var(--sub);font-size:13px;margin-bottom:16px;}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
input.search{flex:1;min-width:200px;padding:9px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:14px;outline:none;}
input.search:focus{border-color:var(--accent);}
button{font-family:inherit;cursor:pointer;}
.btn{padding:8px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:13px;}
.btn:hover{border-color:var(--accent);}
.btn.danger:hover{border-color:var(--danger);color:var(--danger);}
.count{font-size:12px;color:var(--sub);}
.row{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--border);cursor:pointer;}
.row:hover{background:var(--hover);}
.row .t-title{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .t-url{flex:1.2;font-size:11px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .t-date{font-size:11px;color:var(--sub);flex:none;min-width:80px;text-align:right;}
.row .act{flex:none;display:flex;gap:4px;}
.row .btn-sm{padding:3px 9px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--sub);font-size:12px;}
.row .btn-sm:hover{border-color:var(--accent);color:var(--accent);}
.row .btn-sm.del:hover{border-color:var(--danger);color:var(--danger);}
.empty-page{padding:40px;text-align:center;color:var(--sub);}
</style>
</head>
<body>
<h1>稍后读</h1>
<div class="tip">把暂时没空看的页面收进列表：在任意页面右键链接选择“加入稍后读”，或点地址栏旁的稍后读图标。点击条目在新标签页打开，“删除”移出列表，“清空”清掉全部。列表只存本机，不跟随同步。</div>
<div class="bar">
  <input class="search" id="search" type="text" placeholder="搜索稍后读条目（标题或网址）…" autofocus>
  <button class="btn danger" id="clearAll" type="button">清空全部</button>
  <span class="count" id="count"></span>
</div>
<div id="list"></div>
<script>
(function () {
  'use strict';
  var searchEl = document.getElementById('search');
  var countEl = document.getElementById('count');
  var listEl = document.getElementById('list');
  var clearAllEl = document.getElementById('clearAll');
  var items = [];

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = String(text);
    return e;
  }

  function dateText(ds) {
    var d = new Date(String(ds || ''));
    if (isNaN(d.getTime())) return '';
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function filteredList() {
    var q = String(searchEl.value || '').trim().toLowerCase();
    if (!q) return items.slice();
    return items.filter(function (b) {
      return String(b.title || '').toLowerCase().indexOf(q) >= 0
        || String(b.url || '').toLowerCase().indexOf(q) >= 0;
    });
  }

  function render() {
    var list = filteredList();
    setText(countEl, items.length + ' 条稍后读' + (list.length !== items.length ? '，筛出 ' + list.length + ' 条' : ''));
    listEl.textContent = '';
    if (list.length === 0) {
      listEl.appendChild(el('div', 'empty-page', '列表为空'));
      return;
    }
    list.forEach(function (b) {
      var row = el('div', 'row');
      row.appendChild(el('div', 't-title', b.title || b.url || ''));
      row.appendChild(el('div', 't-url', b.url || ''));
      row.appendChild(el('div', 't-date', dateText(b.addedDate)));
      var acts = el('div', 'act');
      var openBtn = el('button', 'btn-sm', '打开');
      openBtn.type = 'button';
      openBtn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        window.electronAPI.invoke('readinglist-open-url', b.url).catch(function () {});
      });
      acts.appendChild(openBtn);
      var delBtn = el('button', 'btn-sm del', '删除');
      delBtn.type = 'button';
      delBtn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        window.electronAPI.invoke('readinglist-remove', { url: b.url })
          .then(function (r) {
            if (!r || !r.ok) return;
            items = items.filter(function (x) { return x.url !== b.url; });
            render();
          })
          .catch(function () {});
      });
      acts.appendChild(delBtn);
      row.appendChild(acts);
      row.addEventListener('click', function () {
        window.electronAPI.invoke('readinglist-open-url', b.url).catch(function () {});
      });
      listEl.appendChild(row);
    });
  }

  function setText(el2, t) { el2.textContent = String(t); }

  searchEl.addEventListener('input', function () { render(); });

  clearAllEl.addEventListener('click', function () {
    if (items.length === 0) return;
    if (!confirm('确定清空全部稍后读条目？')) return;
    window.electronAPI.invoke('readinglist-clear', {})
      .then(function (r) {
        if (!r || !r.ok) return;
        items = [];
        render();
      })
      .catch(function () {});
  });

  function load() {
    if (!window.electronAPI || !window.electronAPI.invoke) return;
    window.electronAPI.invoke('readinglist-snapshot', {})
      .then(function (r) {
        if (!r || !r.ok || !Array.isArray(r.items)) return;
        items = r.items;
        render();
      })
      .catch(function () { listEl.textContent = ''; listEl.appendChild(el('div', 'empty-page', '稍后读数据加载失败')); });
  }
  load();
})();
</script>
</body>
</html>
