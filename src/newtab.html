<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新标签页 - OpenCosy浏览器</title>
    <script src="constants.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('Backdrop.jpg') center/cover no-repeat;
            z-index: 1;
        }

        .background-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1;
        }

        .newtab-container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
            position: relative;
            z-index: 2;
        }

        .logo {
            font-size: 64px;
            font-weight: 300;
            margin-bottom: 10px;
            text-shadow: 0 2px 15px rgba(0,0,0,0.5);
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 18px;
            margin-bottom: 40px;
            opacity: 0.9;
            text-shadow: 0 1px 5px rgba(0,0,0,0.5);
        }

        .search-box {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        .shortcuts {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-top: 36px;
            max-width: 560px;
            margin-left: auto;
            margin-right: auto;
        }

        .shortcut {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 72px;
            cursor: pointer;
            text-decoration: none;
            color: white;
            transition: transform 0.2s ease;
        }

        .shortcut:hover {
            transform: translateY(-3px);
        }

        .shortcut-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }

        .shortcut-label {
            font-size: 11px;
            opacity: 0.85;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            max-width: 72px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .search-input {
            width: 100%;
            padding: 18px 30px;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            color: #ffffff;
            text-align: center;
        }

        .search-input:hover, .search-input:focus {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.3);
            transform: scale(1.02);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 12px;
            opacity: 0.7;
            z-index: 2;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 48px;
            }

            .subtitle {
                font-size: 16px;
            }

            .search-input {
                padding: 15px 20px;
                font-size: 14px;
            }

            .newtab-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="background-container" id="background-container"></div>

    <div class="newtab-container">
        <div class="logo">OpenCosy</div>
        <div class="subtitle">快速、安全、舒适</div>

        <div class="search-box">
            <input type="text" class="search-input" placeholder="搜索网页或输入网址" id="search-input">
        </div>

        <div class="shortcuts" id="shortcuts"></div>
    </div>

    <div class="footer" id="footer">
        OpenCosy浏览器
    </div>

    <script>
        const SEARCH_ENGINES = {
            google: 'https://www.google.com/search?q=',
            baidu: 'https://www.baidu.com/s?wd=',
            bing: 'https://www.bing.com/search?q=',
        };

        const SHORTCUTS = [
            { label: 'Google', icon: 'G', url: 'https://www.google.com' },
            { label: 'Bing', icon: 'B', url: 'https://www.bing.com' },
            { label: '百度', icon: '百', url: 'https://www.baidu.com' },
            { label: 'GitHub', icon: '⌥', url: 'https://github.com' },
            { label: 'YouTube', icon: '▶', url: 'https://www.youtube.com' },
            { label: 'B站', icon: '📺', url: 'https://www.bilibili.com' },
            { label: '知乎', icon: '知', url: 'https://www.zhihu.com' },
            { label: '微博', icon: '微', url: 'https://weibo.com' },
        ];

        function navigateTo(url) {
            window.location.href = url;
        }

        function resolveQuery(query) {
            try {
                const urlObj = new URL(query);
                if (['http:', 'https:', 'file:', 'cosy:'].includes(urlObj.protocol)) {
                    return query;
                }
            } catch {}
            if (query.includes('.') && !query.includes(' ')) {
                return 'https://' + query;
            }
            const settings = JSON.parse(localStorage.getItem('cosySettings') || '{}');
            const searchUrl = SEARCH_ENGINES[settings.searchEngine] || SEARCH_ENGINES.bing;
            return searchUrl + encodeURIComponent(query);
        }

        function renderShortcuts() {
            const container = document.getElementById('shortcuts');
            if (!container) return;
            SHORTCUTS.forEach(s => {
                const a = document.createElement('a');
                a.className = 'shortcut';
                a.href = s.url;
                a.title = s.label;
                const icon = document.createElement('div');
                icon.className = 'shortcut-icon';
                icon.textContent = s.icon;
                const label = document.createElement('div');
                label.className = 'shortcut-label';
                label.textContent = s.label;
                a.appendChild(icon);
                a.appendChild(label);
                container.appendChild(a);
            });
        }

        document.getElementById('search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const query = this.value.trim();
                if (query) navigateTo(resolveQuery(query));
            }
        });

        function setDefaultBackground() {
            setBackgroundImage('Backdrop.jpg');
        }

        function setBackgroundImage(imageUrl) {
            const backgroundContainer = document.getElementById('background-container');
            if (backgroundContainer) {
                backgroundContainer.style.backgroundImage = `url('${imageUrl}')`;
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            if (searchInput) searchInput.focus();

            if (typeof COSY_CONSTANTS !== 'undefined' && COSY_CONSTANTS.APP_INFO) {
                const footer = document.getElementById('footer');
                if (footer) footer.textContent = COSY_CONSTANTS.APP_INFO.name;
            }

            renderShortcuts();
            setDefaultBackground();
        });
    </script>
</body>
</html>
